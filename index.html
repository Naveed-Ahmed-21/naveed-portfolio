<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- React Fast Refresh Preamble Guard to prevent unhandled race condition in development -->
    <script>
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    
    <!-- Primary Identity & Metadata -->
    <title>Naveed Ahmed K — Flutter Developer &amp; Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Naveed Ahmed K — Flutter Developer and Full Stack Developer engineering cross-platform mobile apps, web platforms, and local connectivity tools."
    />
    <meta name="author" content="Naveed Ahmed K" />
    <meta name="theme-color" content="#252922" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="canonical" href="https://naveed-ahmed-21.github.io/naveed-portfolio/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://naveed-ahmed-21.github.io/naveed-portfolio/" />
    <meta property="og:title" content="Naveed Ahmed K — Flutter Developer &amp; Full Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of Naveed Ahmed K — Final-year B.Tech IT student &amp; developer specializing in Flutter mobile apps, React web platforms, and cross-platform tools."
    />
    <meta property="og:image" content="https://naveed-ahmed-21.github.io/naveed-portfolio/images/portrait-cinematic.png" />
    <meta property="og:site_name" content="Naveed Ahmed K Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://naveed-ahmed-21.github.io/naveed-portfolio/" />
    <meta name="twitter:title" content="Naveed Ahmed K — Flutter Developer &amp; Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Naveed Ahmed K — Final-year B.Tech IT student &amp; developer specializing in Flutter mobile apps, React web platforms, and cross-platform tools."
    />
    <meta name="twitter:image" content="https://naveed-ahmed-21.github.io/naveed-portfolio/images/portrait-cinematic.png" />

    <!-- Preload Hero Portrait to Prevent Any Flash or Blank State -->
    <link rel="preload" as="image" href="%BASE_URL%images/portrait-cinematic.png" fetchpriority="high" />

    <!-- Google Fonts Preconnect & Asynchronous Loading (prevents render blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
